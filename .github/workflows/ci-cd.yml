name: Go validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: go-validation-safe-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.0"

jobs:
  simulation-lab:
    name: Validate safe Go simulation lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd/simulation-lab internal/simulation)"
          if [[ -n "$files" ]]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Test simulation package with race detector
        run: go test -race -coverprofile=coverage.out ./internal/simulation ./cmd/simulation-lab

      - name: Vet simulation package
        run: go vet ./internal/simulation ./cmd/simulation-lab

      - name: Build local simulation lab
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/simulation-lab ./cmd/simulation-lab

      - name: Build minimal Go-only container image
        run: docker build -f Dockerfile.simulation -t phantomproxy-lab:ci .

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-lab-coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: simulation-lab-linux-amd64
          path: dist/simulation-lab
          if-no-files-found: error
